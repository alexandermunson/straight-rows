<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straight Rows Viewer</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1c1f24; --muted:#6b7280; --grid:#e5e7eb; --axis:#9ca3af; --border:#d8dbe0;
  --accent:#2563eb; --hl:#eef2ff; --plotbg:#ffffff; --tipbg:rgba(255,255,255,.96);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111418; --panel:#181c22; --text:#e6e8eb; --muted:#9aa3af; --grid:#272c34; --axis:#5b6470; --border:#2b313a;
    --accent:#60a5fa; --hl:#1e2a44; --plotbg:#14181d; --tipbg:rgba(24,28,34,.96); }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 400px;height:100vh;gap:8px;padding:8px}
aside,section,main{background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:0}
aside{display:flex;flex-direction:column;padding:10px;gap:10px;overflow:hidden}
h1{font-size:15px;margin:0}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer}
button:hover{border-color:var(--accent)} button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
#events{flex:1;overflow:auto;border:1px solid var(--border);border-radius:6px}
.ev{display:flex;gap:6px;padding:5px 7px;border-bottom:1px solid var(--grid);cursor:pointer;align-items:flex-start}
.ev:hover{background:var(--hl)} .ev.sel{background:var(--hl);outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex:none}
.ev small{color:var(--muted);display:block}
h4.why{margin:10px 0 2px;font-size:12px} p.why{margin:0 0 4px;line-height:1.5;max-width:70ch;white-space:pre-line} details{margin-top:10px} details summary{cursor:pointer;color:var(--muted)}
.kind{font-weight:600;font-size:10px;padding:0 4px;border-radius:3px;border:1px solid var(--border);margin-right:4px}
main{display:flex;flex-direction:column;padding:6px;gap:6px}
#strip{height:64px;width:100%;display:block;border-radius:6px;cursor:ew-resize;touch-action:none}
#plots{position:relative;flex:1;min-height:0}
#plots canvas{position:absolute;inset:0;width:100%;height:100%}
#top{cursor:crosshair;touch-action:none}
section{display:flex;flex-direction:column;padding:8px;gap:8px;overflow:hidden}
#map{width:100%;height:340px;display:block;border-radius:6px;background:var(--plotbg);border:1px solid var(--border)}
#info{flex:1;overflow:auto;font-size:12px}
#info h3{margin:0 0 4px;font-size:14px}
#info .meta{color:var(--muted);margin-bottom:6px}
#info ul{margin:6px 0 0;padding-left:16px} #info li{margin:0 0 5px}
#status{position:absolute;right:8px;top:6px;font-size:11px;color:var(--muted);background:var(--panel);padding:1px 6px;border-radius:10px;border:1px solid var(--border);z-index:5}
kbd{background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Straight Rows</h1>
    <div><h2>Tractors</h2><div class="row" id="trs"></div></div>
    <div><h2>Overlays</h2><div class="row" id="opts"></div></div>
    <div><h2>Window</h2><div class="row" id="spans"></div></div>
    <div><h2>Events</h2>
      <div class="row">
        <label><input type="checkbox" id="fTruth" checked>truth</label>
        <label><input type="checkbox" id="fDet" checked>ours</label>
        <select id="fCls"><option value="ALL">all classes</option></select>
      </div>
    </div>
    <div id="events"></div>
    <div class="legend"><span><kbd>n</kbd><kbd>p</kbd> events</span><span><kbd>←</kbd><kbd>→</kbd> pan</span><span><kbd>+</kbd><kbd>-</kbd> zoom</span><span><kbd>0</kbd> all</span></div>
  </aside>
  <main>
    <canvas id="strip"></canvas>
    <div id="plots"><canvas id="base"></canvas><canvas id="top"></canvas><div id="status">loading…</div></div>
  </main>
  <section>
    <canvas id="map"></canvas>
    <div class="legend" id="legend"></div>
    <div id="info"></div>
  </section>
</div>
<script>
'use strict';
// ------------------------------------------------------------------ constants
const TC = ['#0072B2', '#009E73', '#CC79A7'];
const CH = {cn0: 0, mincn0: 1, xte: 2, sats: 3, fix: 4, link: 5, lat: 6, lon: 7, spd: 8}, NCH = 9;
const CLS = {SPACE_WEATHER: ['#6a3d9a', 'SW'], JAMMING: ['#e31a1c', 'JAM'], SPOOFING: ['#ff7f00', 'SPOOF'],
             EQUIPMENT_FAULT: ['#8c6d31', 'EQUIP'], MULTIPATH: ['#7f7f7f', 'MP']};
const PANELS = [['mean C/N0 (dB-Hz)', 1.2], ['min C/N0 (dB-Hz)', 1.2], ['|XTE| (m)', 1.0], ['satellites', 0.8],
                ['fix quality', 0.8], ['base link', 0.75], ['SDA  Kp / S4', 1.15]];
const ML = 74, MR = 46, MT = 6, MB = 24, GAP = 6, BUDGET = 20000;
const SPANS = [['10 min', 600], ['1 h', 3600], ['3 h', 10800], ['6 h', 21600], ['12 h', 43200], ['24 h', 86400], ['72 h', 259200]];
const $ = id => document.getElementById(id);
const FIXSHORT = ['NO FIX', 'AUTO', 'DGPS', 'FLOAT', 'FIXED'];

// ------------------------------------------------------------------ state
let M = null, EPOCH = 0, TOTAL = 259200;
const LV = {};                                  // res -> {n, a:[tr][ch] Float32Array}
const view = {t0: 0, t1: 259200}, target = {t0: 0, t1: 259200};
const S = {vis: [true, true, true], truth: true, dets: true, mp: true, base: true, xlog: false, sel: -1,
           hoverX: null, hoverY: null, kind: {TRUTH: true, DET: true}, cls: 'ALL', drag: null};
let dirtyBase = true, dirtyTop = true, lastFrame = 0, curRes = 60, P = [];       // P = last drawn panel geometry
let cssv = null, cache = null;

// ------------------------------------------------------------------ helpers
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function fmtT(t, secs) {
  const d = new Date(EPOCH + t * 1000);
  return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` + (secs ? `:${pad2(d.getUTCSeconds())}` : '') + 'Z';
}
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const css = n => cssv.getPropertyValue(n).trim();
function fit(cv) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  return {c, w: r.width, h: r.height};
}
function pickRes() {
  const span = view.t1 - view.t0;
  for (const r of [1, 10, 60]) if (LV[r] && span / r <= BUDGET) return r;
  return LV[60] ? 60 : 0;
}

// ------------------------------------------------------------------ decimation (min/max per pixel column)
// Returns {mode:0, i0, i1} when points are sparse enough to draw directly, else {mode:1, mn, mx, lo, hi}.
function dec(arr, res, x0, w, t0, t1, tf) {
  const W = Math.max(1, Math.floor(w)), span = t1 - t0;
  const i0 = Math.max(0, Math.floor(t0 / res) - 1), i1 = Math.min(arr.length, Math.ceil(t1 / res) + 2);
  let lo = Infinity, hi = -Infinity;
  if (i1 - i0 <= 0.6 * W) {                       // sparse: a real polyline is cheap and exact
    for (let i = i0; i < i1; i++) { const v = arr[i]; if (v === v) { const y = tf ? tf(v) : v; if (y < lo) lo = y; if (y > hi) hi = y; } }
    return {mode: 0, i0, i1, lo, hi};
  }
  const mn = new Float32Array(W).fill(Infinity), mx = new Float32Array(W).fill(-Infinity), ls = new Float32Array(W), k = W / span;
  for (let i = i0; i < i1; i++) {
    const v = arr[i]; if (v !== v) continue;
    const y = tf ? tf(v) : v;
    let c = Math.floor((i * res + res / 2 - t0) * k); if (c < 0 || c >= W) continue;
    if (y < mn[c]) mn[c] = y; if (y > mx[c]) mx[c] = y; ls[c] = y;
    if (y < lo) lo = y; if (y > hi) hi = y;
  }
  return {mode: 1, mn, mx, ls, lo, hi, W};
}
// draw a decimated series into rect r; fy maps (transformed) value -> pixel y; off adds a value offset; step for categorical
function strokeSeries(c, dd, arr, res, r, t0, t1, fy, tf, color, lw, step, off, sc) {
  const span = t1 - t0, k = r.w / span;
  c.beginPath(); c.strokeStyle = color; c.lineWidth = lw;
  const o = off || 0, m = sc || 1;
  if (dd.mode === 0) {
    let started = false, py = 0;
    for (let i = dd.i0; i < dd.i1; i++) {
      let v = arr[i]; if (v !== v) { started = false; continue; }
      const x = r.x + (i * res + (step ? 0 : res / 2) - t0) * k, y = fy((tf ? tf(v) : v) * m + o);
      if (!started) { c.moveTo(x, y); started = true; } else { if (step) c.lineTo(x, py); c.lineTo(x, y); }
      py = y;
    }
    if (started && step) c.lineTo(r.x + r.w, py);
  } else {
    // dense: one pixel-aligned rect per column spanning [min,max]. No anti-aliasing / joins, ~10x cheaper than a zigzag stroke.
    c.fillStyle = color; const hmin = Math.max(1, lw * 0.9);
    let prev = NaN;                                  // last value of the previous column: joins sparse columns into a continuous trace
    for (let col = 0; col < dd.W; col++) {
      const a = dd.mn[col]; if (a === Infinity) { prev = NaN; continue; }
      let lo = a, hi = dd.mx[col];
      if (prev === prev) { if (prev < lo) lo = prev; if (prev > hi) hi = prev; }
      prev = dd.ls[col];
      const ya = fy(lo * m + o), yb = fy(hi * m + o), top = Math.min(ya, yb);
      c.fillRect(r.x + col, top - hmin / 2, 1, Math.abs(ya - yb) + hmin);
    }
    return;
  }
  c.stroke();
}

// ------------------------------------------------------------------ layout
function layout(w, h) {
  const inner = h - MT - MB - GAP * (PANELS.length - 1), tot = PANELS.reduce((s, p) => s + p[1], 0);
  let y = MT;
  return PANELS.map(p => { const ph = inner * p[1] / tot, r = {x: ML, y, w: w - ML - MR, h: ph}; y += ph + GAP; return r; });
}
function timeTicks(t0, t1, w) {
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  const st = steps.find(s => (t1 - t0) / s <= w / 95) || 86400, out = [];
  for (let t = Math.ceil(t0 / st) * st; t <= t1; t += st) out.push([t, st]);
  return out;
}
const tickLabel = (t, st) => {
  const d = new Date(EPOCH + t * 1000), hm = `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
  if (st >= 86400 || (d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0)) return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${hm}`;
  return st < 60 ? `${hm}:${pad2(d.getUTCSeconds())}` : hm;
};

// ------------------------------------------------------------------ main draw
function drawBase() {
  const {c, w, h} = fit($('base'));
  const {t0, t1} = view, span = t1 - t0, res = pickRes(); curRes = res;
  c.clearRect(0, 0, w, h);
  c.fillStyle = css('--plotbg'); c.fillRect(0, 0, w, h);
  const rects = layout(w, h); P = [];
  const grid = css('--grid'), axis = css('--axis'), txt = css('--muted');
  c.font = '10px system-ui, sans-serif';
  const L = LV[res];
  const tf = {xte: S.xlog ? v => Math.log10(1 + v / 0.1) : null};
  const xOf = t => rects[0].x + (t - t0) / span * rects[0].w;

  rects.forEach((r, pi) => {
    // ---- y range
    let lo = Infinity, hi = -Infinity; const decs = [];
    const chOf = ['cn0', 'mincn0', 'xte', 'sats', 'fix', 'link'][pi];
    if (L && chOf) {
      for (let tr = 0; tr < 3; tr++) {
        if (!S.vis[tr]) { decs.push(null); continue; }
        const arr = L.a[tr][CH[chOf]], d = dec(arr, res, r.x, r.w, t0, t1, tf[chOf]);
        decs.push(d); lo = Math.min(lo, d.lo); hi = Math.max(hi, d.hi);
      }
    }
    if (pi === 0 || pi === 1) { if (S.base && M) for (let tr = 0; tr < 3; tr++) if (S.vis[tr]) { const b = M.base[M.tractors[tr]][chOf]; lo = Math.min(lo, b); hi = Math.max(hi, b); } }
    let y0, y1;
    if (pi === 2) { y0 = 0; y1 = Math.max(hi * 1.1, S.xlog ? 0.5 : 0.35); }
    else if (pi === 4) { y0 = -0.4; y1 = 4.6; }
    else if (pi === 5) { y0 = -0.2; y1 = 3.0; }
    else if (pi === 6) { y0 = 0; y1 = 9.5; }
    else { if (!isFinite(lo)) { lo = 0; hi = 1; } const m = Math.max((hi - lo) * 0.08, 0.5); y0 = lo - m; y1 = hi + m; }
    const fy = v => r.y + r.h - (v - y0) / (y1 - y0) * r.h;
    P.push({r, fy, y0, y1, res});

    // ---- grid + y labels
    c.save(); c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
    c.strokeStyle = grid; c.lineWidth = 1;
    for (const [t] of timeTicks(t0, t1, r.w)) { const x = Math.round(xOf(t)) + 0.5; c.beginPath(); c.moveTo(x, r.y); c.lineTo(x, r.y + r.h); c.stroke(); }
    let yt;
    if (pi === 2 && S.xlog) yt = [0, 0.1, 0.3, 1, 3, 10, 30].filter(v => tf.xte(v) <= y1).map(v => [tf.xte(v), v]);
    else if (pi === 4) yt = [0, 1, 2, 3, 4].map(v => [v, v]);
    else if (pi === 5) yt = [0, 1, 2].map(v => [v + 0.4, v]);
    else yt = niceTicks(y0, y1, Math.max(2, Math.floor(r.h / 26))).map(v => [v, v]);
    for (const [yv] of yt) { const y = Math.round(fy(yv)) + 0.5; c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); c.stroke(); }
    c.restore();
    c.fillStyle = txt; c.textAlign = 'right'; c.textBaseline = 'middle';
    for (const [yv, lab] of yt) {
      let s = pi === 4 ? FIXSHORT[lab] : pi === 5 ? `T${lab + 1}` : (Math.abs(lab) >= 100 ? lab.toFixed(0) : +lab.toFixed(2)).toString();
      c.fillText(s, r.x - 6, fy(yv));
    }
    c.save(); c.translate(11, r.y + r.h / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.fillStyle = txt; c.font = '10px system-ui'; c.fillText(PANELS[pi][0], 0, 0); c.restore();
    c.strokeStyle = axis; c.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    // ---- series
    c.save(); c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
    if (pi <= 5 && L) {
      for (let tr = 0; tr < 3; tr++) {
        const d = decs[tr]; if (!d) continue;
        const arr = L.a[tr][CH[chOf]];
        if (pi === 4) strokeSeries(c, d, arr, res, r, t0, t1, fy, null, TC[tr], 1.4, true, 0.09 * tr);
        else if (pi === 5) strokeSeries(c, d, arr, res, r, t0, t1, fy, null, TC[tr], 1.6, true, tr, 0.8);
        else strokeSeries(c, d, arr, res, r, t0, t1, fy, tf[chOf], TC[tr], res === 1 && d.mode === 0 ? 1 : 1.2, false, 0);
      }
      if (pi <= 1 && S.base) {
        c.setLineDash([2, 3]); c.lineWidth = 1;
        for (let tr = 0; tr < 3; tr++) if (S.vis[tr]) { c.strokeStyle = TC[tr] + '99'; const y = fy(M.base[M.tractors[tr]][chOf]); c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); c.stroke(); }
        c.setLineDash([]);
      }
      if (pi === 2) { const y = fy(S.xlog ? tf.xte(1) : 1); c.strokeStyle = axis; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); c.stroke(); c.setLineDash([]); }
    }
    if (pi === 6 && M) drawSDA(c, r, fy, t0, t1, xOf, y0, y1);
    c.restore();
  });

  // ---- time axis
  const last = rects[rects.length - 1];
  c.fillStyle = txt; c.textAlign = 'center'; c.textBaseline = 'top';
  for (const [t, st] of timeTicks(t0, t1, last.w)) { const x = xOf(t); if (x >= last.x - 2 && x <= last.x + last.w + 2) c.fillText(tickLabel(t, st), x, last.y + last.h + 5); }

  drawOverlays(c, rects, xOf, t0, t1, span);
  $('status').textContent = res ? `${res} s bins · ${new Date(EPOCH + t0 * 1000).toISOString().slice(0, 16)}Z → ${new Date(EPOCH + t1 * 1000).toISOString().slice(0, 16)}Z` : 'loading…';
}

function drawSDA(c, r, fy, t0, t1, xOf, y0, y1) {
  const kp = M.kp; c.beginPath(); c.strokeStyle = css('--text'); c.lineWidth = 1.4; c.globalAlpha = .8;
  let st = false;
  for (let i = 0; i < kp.length; i++) {
    const x = xOf(kp[i][0]), y = fy(kp[i][1]);
    if (!st) { c.moveTo(x, y); st = true; } else { c.lineTo(x, c.__py); c.lineTo(x, y); }
    c.__py = y;
  }
  if (st) c.lineTo(xOf(t1 + 1e5), c.__py);
  c.stroke(); c.globalAlpha = 1;
  c.setLineDash([2, 3]); c.strokeStyle = css('--axis'); c.beginPath(); c.moveTo(r.x, fy(5)); c.lineTo(r.x + r.w, fy(5)); c.stroke(); c.setLineDash([]);
  // S4 on the right axis (0..s4max)
  const s4max = 0.6, fs = v => r.y + r.h - v / s4max * r.h;
  c.beginPath(); c.strokeStyle = '#6a3d9a'; c.lineWidth = 1.2; st = false;
  const s4 = M.s4;
  for (let i = 0; i < s4.length; i++) {
    const t = s4[i][0]; if (t < t0 - 3600 || t > t1 + 3600) continue;
    const x = xOf(t), y = fs(Math.min(s4[i][1], s4max));
    if (!st) { c.moveTo(x, y); st = true; } else c.lineTo(x, y);
  }
  c.stroke();
  c.setLineDash([2, 3]); c.strokeStyle = '#6a3d9a88'; c.beginPath(); c.moveTo(r.x, fs(0.3)); c.lineTo(r.x + r.w, fs(0.3)); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#6a3d9a'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = '10px system-ui';
  c.restore(); c.save();
  for (const v of [0, 0.2, 0.4, 0.6]) c.fillText(v.toFixed(1), r.x + r.w + 4, fs(v));
  c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
  for (const q of M.rfi) if (q.t >= t0 - 3600 && q.t <= t1) {
    const x = xOf(q.t); c.strokeStyle = '#e31a1c'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, r.y); c.lineTo(x, r.y + r.h); c.stroke();
    c.fillStyle = '#e31a1c'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(` RFI ${q.id} c=${q.conf.toFixed(2)}`, x, r.y + 2);
  }
  for (const a of M.adv) if (a.t >= t0 && a.t <= t1) {
    const x = xOf(a.t); c.strokeStyle = css('--axis'); c.setLineDash([4, 3]); c.lineWidth = 1; c.beginPath(); c.moveTo(x, r.y); c.lineTo(x, r.y + r.h); c.stroke(); c.setLineDash([]);
    c.fillStyle = css('--muted'); c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillText(' ' + a.type, x, r.y + r.h - 2);
  }
}

function inView(e) { return e.e >= view.t0 && e.s <= view.t1; }
function drawOverlays(c, rects, xOf, t0, t1, span) {
  const top = rects[0].y, bot = rects[rects.length - 1].y + rects[rects.length - 1].h, x0 = rects[0].x, x1 = x0 + rects[0].w;
  c.save(); c.beginPath(); c.rect(x0, 0, x1 - x0, bot + 2); c.clip();

  await loadLevel(60); await loadLevel(10);
  if (h.has('ev') && +h.get('ev') >= 0) select(+h.get('ev'), !h.has('t0'));
  $('status').textContent = 'loading 1 s data…';
  await loadLevel(1);
  dirtyBase = true;
  if (location.search.includes('bench')) await bench();
  if (test) { await new Promise(r => setTimeout(r, 400)); await fetch('/ready', {method: 'POST'}); }
}

// ------------------------------------------------------------------ benchmark (?test&bench): timings are POSTed to the server log
async function bench() {
  const out = [], cfgs = [['72 h', 0, 259200], ['24 h', 86400, 172800], ['6 h', 100000, 121600], ['1 h', 100000, 103600], ['10 min', 100000, 100600]];
  for (const [name, a, b] of cfgs) {
    setTarget(a, b, true); cssv = getComputedStyle(document.documentElement);
    drawBase(); drawStrip(); drawMap();                                   // warm up
    const N = 40, t = performance.now();
    for (let i = 0; i < N; i++) { const sh = (b - a) * 0.01 * i; view.t0 = a + sh; view.t1 = b + sh; drawBase(); drawStrip(); drawMap(); }
    const full = (performance.now() - t) / N;
    const t2 = performance.now(); S.hoverX = 600; S.hoverY = 200; for (let i = 0; i < N; i++) drawTop(); const hov = (performance.now() - t2) / N;
    const tm = f => { const t = performance.now(); for (let i = 0; i < 20; i++) f(); return ((performance.now() - t) / 20).toFixed(1); };
    view.t0 = a; view.t1 = b;
    out.push(`   parts: base ${tm(drawBase)} ms, strip ${tm(drawStrip)} ms, map ${tm(drawMap)} ms`);
    out.push(`${name.padEnd(7)} res=${curRes}s  full redraw ${full.toFixed(1)} ms  (${(1000 / full).toFixed(0)} fps)   hover layer ${hov.toFixed(2)} ms`);
    setTarget(a, b, true);
  }
  await fetch('/perf', {method: 'POST', body: out.join('\n')});
}
init().catch(err => { $('status').textContent = 'error: ' + err; console.error(err); });
