<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straight Rows Viewer</title>
<style>
:root{
  /* design tokens (redesign/DESIGN.md). Canvases read the same tokens through readTheme() and css(). */
  color-scheme: light;
  --bg:#FAFAF9; --ink:#16191D; --ink-2:#4A525C; --ink-3:#68717C;
  --line:#E2E4E7; --line-2:#C9CDD2; --grid:#EEEFF1; --hover:#F1F2F3; --sel:#E9EBEE; --warn:#B42318;
  --tipbg:rgba(250,250,249,.96);
  /* tractors (lines and dots) and causes (fills and marks; never used as a text colour) */
  --t1:#0072B2; --t2:#009E73; --t3:#3B424D;
  --c-sw:#6A3D9A; --c-jam:#D62728; --c-spoof:#E06A00; --c-equip:#8C6D31; --c-mp:#7F7F7F;
  /* names the drawing code already reads */
  --text:var(--ink); --muted:var(--ink-3); --axis:var(--line-2); --border:var(--line); --accent:var(--ink);
  --hl:var(--sel); --plotbg:var(--bg); --panel:var(--bg);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#111316; --ink:#E8EAED; --ink-2:#B4BBC4; --ink-3:#8C949E;
    --line:#262A30; --line-2:#3A4049; --grid:#1D2025; --hover:#1A1D21; --sel:#22262C; --warn:#FF8A80;
    --tipbg:rgba(17,19,22,.96);
    --t1:#56B4E9; --t2:#2BB98F; --t3:#C9CED6;
    --c-sw:#A884D8; --c-jam:#FF6B6B; --c-spoof:#FF9F43; --c-equip:#C9A35A; --c-mp:#9AA0A6; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
/* one continuous surface; columns separated by hairlines, no cards */
#app{display:grid;grid-template-columns:clamp(272px,19vw,296px) minmax(0,1fr) clamp(340px,24vw,384px);height:100vh}
aside{display:flex;flex-direction:column;gap:16px;padding:16px 16px 12px;border-right:1px solid var(--line);min-height:0;overflow:hidden}
main{display:flex;flex-direction:column;gap:8px;padding:12px 12px 8px;min-height:0}
section{display:flex;flex-direction:column;gap:12px;padding:16px;border-left:1px solid var(--line);min-height:0;overflow:hidden}
h1{font-size:15px;font-weight:600;margin:0}
h2{font-size:11px;font-weight:600;color:var(--ink-3);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--ink);margin:0;width:13px;height:13px}
button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line-2);border-radius:4px;height:24px;padding:0 8px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.on,button.on:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;font-size:12px;height:24px;background:transparent;color:var(--ink);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.seg{display:inline-flex} .seg>button{border-radius:0;margin-left:-1px} .seg>button:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg>button:last-child{border-radius:0 4px 4px 0} .seg>button.on{position:relative}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
.cs{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
/* folds: the same chevron everywhere; default open/closed states are set where each fold is built */
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:none;width:5px;height:5px;margin:0 3px 0 1px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .12s ease;opacity:.75}
details[open]>summary::before{transform:rotate(45deg)}
aside details.layers>summary{color:var(--ink-2);font-size:12px}
aside details.layers .row{margin:8px 0 0 15px;flex-direction:column;align-items:flex-start;gap:6px}
#trs{gap:16px}
#spans{display:grid;grid-template-columns:repeat(4,1fr);gap:4px} #spans button{padding:0}
.evhead{display:flex;align-items:center;justify-content:space-between}
#events{flex:1;overflow:auto;margin:-8px -16px 0;border-bottom:1px solid var(--line)}
.ev{display:flex;gap:8px;align-items:center;padding:7px 16px;border-top:1px solid var(--line);cursor:pointer}
.ev:hover{background:var(--hover)}
.ev.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--ink)}
.ev:focus-visible{outline-offset:-2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ev .t{flex:1;min-width:0} .ev .l1,.ev .l2{display:flex;align-items:baseline;gap:6px;min-width:0}
.ev .l1 b{font-weight:600;white-space:nowrap} .ev .l1 .m{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .l1 .lab,.ev .l2 .pill{margin-left:auto;flex:none}
.ev small{color:var(--ink-3);font:11px/1.45 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* confidence chip: the only badge in the interface */
.pill{display:inline-block;font:11px/16px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;white-space:nowrap}
.lab{font:11px/1.4 var(--mono);color:var(--ink-3);white-space:nowrap} .lab.miss{color:var(--warn);font-weight:600}
.empty{color:var(--ink-3);padding:12px 16px;margin:0;line-height:1.5}
kbd{font:11px var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;margin-right:2px}
#strip{height:56px;width:100%;display:block;cursor:ew-resize;touch-action:none}
#plots{position:relative;flex:1;min-height:0;border-top:1px solid var(--line)}
#plots canvas{position:absolute;inset:0;width:100%;height:100%}
#top{cursor:crosshair;touch-action:none}
#status{position:absolute;right:46px;top:1px;z-index:5;font:11px/16px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 6px}
#mapbar{display:flex;gap:8px;align-items:center}
#map{width:100%;height:300px;display:block;background:var(--bg);border:1px solid var(--line)}
#info{flex:1;overflow:auto;font-size:13px;margin:0 -16px;padding:0 16px}
#info .hd{display:flex;align-items:center;gap:8px}
#info .hd h3{flex:1;margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
#info .meta{color:var(--ink-3);font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.mono{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
#info .act{font-weight:600;margin:0 0 2px}
#info .brief{margin:0 0 12px;color:var(--ink-2);line-height:1.5}
#info .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
#info .note{color:var(--ink-2);border-left:2px solid var(--line-2);padding:2px 0 2px 10px;margin:0 0 12px;line-height:1.5}
#info details.sec{border-top:1px solid var(--line);padding:8px 0;margin:0}
#info details.sec>summary{font-weight:600}
#info details.sec.minor>summary{font-weight:400;color:var(--ink-2)}
#info details.sec p{margin:6px 0 2px 15px;line-height:1.55;max-width:72ch;white-space:pre-line}
h4.why{margin:12px 0 2px 15px;font-size:13px;font-weight:600} p.why{margin:0 0 4px 15px;line-height:1.55;max-width:72ch;white-space:pre-line}
#info ul{margin:8px 0 4px 15px;padding-left:16px;color:var(--ink-2)} #info li{margin:0 0 6px;line-height:1.5}
#info .empty{padding:0}
/* tabs: a short vertical list; the active one carries the ink bar, like a selected event */
#tabs{display:flex;flex-direction:column;margin:0 -16px}
#tabs button{border:0;border-radius:0;height:28px;text-align:left;padding:0 16px;font-size:13px;color:var(--ink-2)}
#tabs button.on,#tabs button.on:hover{background:var(--sel);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
#ops,#spec{display:none;grid-column:2 / -1;background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:0;overflow:auto;padding:18px 22px}
body.ops main, body.ops section, body.spec main, body.spec section{display:none} body.ops #ops, body.spec #spec{display:block}
body.ops aside>*:not(h1):not(#tabs), body.spec aside>*:not(h1):not(#tabs){display:none} body.ops #app, body.spec #app{grid-template-columns:180px minmax(0,1fr) 0}
#ops .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#ops h2{font-size:18px;text-transform:none;letter-spacing:0;color:var(--text);margin:0;flex:1}
#ops .lanes{border:1px solid var(--border);border-radius:8px;padding:10px 14px 6px;margin-bottom:8px}
#ops .lane{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
#ops .track{position:relative;height:22px;background:var(--bg);border-radius:4px}
#ops .track a{position:absolute;top:0;height:100%;border-radius:3px;cursor:pointer;opacity:.85;min-width:4px}
#ops .track a:hover{opacity:1;outline:2px solid var(--text)}
#ops .hours{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:10px;color:var(--muted)} #ops .hours div{display:flex;justify-content:space-between}
#ops .key{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:0 0 16px} #ops .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#ops .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
#ops .col>h3{margin:0;font-size:15px} #ops .sum{color:var(--muted);font-size:12px;margin:2px 0 10px}
details.card{border:1px solid var(--border);border-left-width:5px;border-radius:6px;margin:0 0 8px;background:var(--panel)}
details.card[open]{box-shadow:0 2px 10px rgba(0,0,0,.08)}
details.card>summary{list-style:none;cursor:pointer;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
details.card>summary::-webkit-details-marker{display:none}
.card .when{font-size:11px;color:var(--muted);grid-column:1} .card .pill{grid-column:2;grid-row:1 / span 2;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.card .act{font-size:13.5px;font-weight:700;grid-column:1} .card .brief{grid-column:1 / -1;color:var(--muted);line-height:1.45;margin-top:2px}
.card .body{padding:2px 11px 11px;border-top:1px solid var(--grid)}
.card h5{margin:11px 0 2px;font-size:11px;font-weight:700;color:var(--text)} .card p{margin:0;line-height:1.55;color:var(--text)}
.card .more{margin-top:10px} .card .more summary{cursor:pointer;color:var(--muted);font-size:12px} .card button{margin-top:10px}
.ok{border:1px dashed var(--border);border-radius:6px;padding:7px 11px;margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.45}
#ops table{border-collapse:collapse;margin:8px 0} #ops td,#ops th{border:1px solid var(--border);padding:3px 9px;text-align:left;font-size:12px}
#ops details.trust{margin:0 0 16px;font-size:12px;color:var(--muted)} #ops details.trust summary{cursor:pointer} #ops details.trust div{max-width:100ch;line-height:1.5;margin-top:6px;color:var(--text)}
#spec h2{font-size:18px;text-transform:none;letter-spacing:0;color:var(--text);margin:0;flex:1} #spec .top{display:flex;align-items:center;margin-bottom:8px}
#spec h3{margin:20px 0 4px;font-size:15px} #spec .lead{max-width:100ch;line-height:1.55;margin:0 0 10px}
#spec .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0} #spec .trs{display:flex;gap:12px}
#spec .sum{font-size:13px;margin:0 0 8px} #spec canvas{width:100%;display:block;border:1px solid var(--border);border-radius:6px}
#spec table{border-collapse:collapse;margin:10px 0} #spec td,#spec th{border:1px solid var(--border);padding:3px 9px;text-align:left;font-size:12px}
#spec details.trust{margin:0 0 8px;font-size:12px;color:var(--muted)} #spec details.trust summary{cursor:pointer} #spec details.trust div{max-width:100ch;line-height:1.5;margin-top:6px;color:var(--text)}
#spec .key{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 0 0} #spec .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-3);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Straight Rows</h1>
    <div id="tabs"><button id="tabInv" class="on">Investigate</button><button id="tabOps">Operator actions</button><button id="tabSpec">Spectral</button></div>
    <div class="row" id="trs"></div>
    <div class="row" id="spans"></div>
    <details class="layers"><summary>Layers on the plots</summary><div class="row" id="opts"></div></details>
    <div class="evhead"><h2>Events</h2><select id="fCls"><option value="ALL">all causes</option></select></div>
    <div id="events"></div>
    <div class="legend" id="keys"><span><kbd>n</kbd><kbd>p</kbd> next / previous event</span><span><kbd>←</kbd><kbd>→</kbd> pan</span><span><kbd>+</kbd><kbd>-</kbd> zoom</span><span><kbd>0</kbd> show all</span></div>
  </aside>
  <main>
    <canvas id="strip"></canvas>
    <div id="plots"><canvas id="base"></canvas><canvas id="top"></canvas><div id="status">loading…</div></div>
  </main>
  <div id="ops"></div>
  <div id="spec"></div>
  <section>
    <div id="mapbar"><span class="seg"><button id="mapField" title="Zoom to the field">Field</button><button id="mapAll" title="Zoom out to show the whole of every interference-report area and the estimated source">Whole report area</button></span>
      <span class="seg"><button id="mapOut" title="Zoom out" aria-label="Zoom the map out">−</button><button id="mapIn" title="Zoom in" aria-label="Zoom the map in">+</button></span></div>
    <canvas id="map" title="Scroll to zoom · drag to move · double-click to reset"></canvas>
    <div class="legend" id="legend"></div>
    <div id="info"></div>
  </section>
</div>
<script>
'use strict';
// ------------------------------------------------------------------ constants
const TC = ['#0072B2', '#009E73', '#CC79A7'];
const CH = {cn0: 0, mincn0: 1, xte: 2, sats: 3, fix: 4, link: 5, lat: 6, lon: 7, spd: 8}, NCH = 9;
const CLS = {SPACE_WEATHER: ['#6a3d9a', 'SW'], JAMMING: ['#e31a1c', 'JAM'], SPOOFING: ['#ff7f00', 'SPOOF'],
             EQUIPMENT_FAULT: ['#8c6d31', 'EQUIP'], MULTIPATH: ['#7f7f7f', 'MP']};
const PANELS = [['mean C/N0 · dB-Hz', 1.2], ['min C/N0 · dB-Hz', 1.2], ['|XTE| · m', 1.0], ['satellites', 0.8],
                ['fix quality', 0.8], ['base link', 0.75], ['SDA · Kp left, S4 right', 1.15]];
const ML = 74, MR = 46, MT = 20, MB = 24, GAP = 20, BUDGET = 20000;     // MT/GAP leave a title row above each panel
const SPANS = [['10 min', 600], ['1 h', 3600], ['3 h', 10800], ['6 h', 21600], ['12 h', 43200], ['24 h', 86400], ['72 h', 259200]];
const $ = id => document.getElementById(id);
const FIXSHORT = ['NO FIX', 'AUTO', 'DGPS', 'FLOAT', 'FIXED'];
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
const MONO = 'ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace';
// Tractor and cause colours come from the CSS tokens so the plots and the HTML always agree (and follow light/dark).
const TVAR = ['--t1', '--t2', '--t3'];
const CVAR = {SPACE_WEATHER: '--c-sw', JAMMING: '--c-jam', SPOOFING: '--c-spoof', EQUIPMENT_FAULT: '--c-equip', MULTIPATH: '--c-mp'};
const tvar = i => `var(${TVAR[i]})`, cvar = k => `var(${CVAR[k]})`;
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  TVAR.forEach((v, i) => { TC[i] = cs.getPropertyValue(v).trim(); });
  for (const k in CVAR) CLS[k][0] = cs.getPropertyValue(CVAR[k]).trim();
}

// ------------------------------------------------------------------ state
let M = null, EPOCH = 0, TOTAL = 259200;
const LV = {};                                  // res -> {n, a:[tr][ch] Float32Array}
const view = {t0: 0, t1: 259200}, target = {t0: 0, t1: 259200};
const MV = {z: 1, cx: 0, cy: 0, all: false, s: 1, cl: 1};      // map view: zoom factor, pan (degrees), fit-to-report-areas flag
const S = {vis: [true, true, true], truth: true, dets: true, mp: true, base: true, xlog: false, sel: -1,
           hoverX: null, hoverY: null, kind: {TRUTH: true, DET: true}, cls: 'ALL', drag: null};
let dirtyBase = true, dirtyTop = true, lastFrame = 0, curRes = 60, P = [];       // P = last drawn panel geometry
let cssv = null, cache = null;

// ------------------------------------------------------------------ helpers
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function fmtT(t, secs) {
  const d = new Date(EPOCH + t * 1000);
  return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` + (secs ? `:${pad2(d.getUTCSeconds())}` : '') + 'Z';
}
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const css = n => cssv.getPropertyValue(n).trim();
function fit(cv) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  return {c, w: r.width, h: r.height};
}
function pickRes() {
  const span = view.t1 - view.t0;
  for (const r of [1, 10, 60]) if (LV[r] && span / r <= BUDGET) return r;
  return LV[60] ? 60 : 0;
}

// ------------------------------------------------------------------ decimation (min/max per pixel column)
// Returns {mode:0, i0, i1} when points are sparse enough to draw directly, else {mode:1, mn, mx, lo, hi}.
function dec(arr, res, x0, w, t0, t1, tf) {
  const W = Math.max(1, Math.floor(w)), span = t1 - t0;
  const i0 = Math.max(0, Math.floor(t0 / res) - 1), i1 = Math.min(arr.length, Math.ceil(t1 / res) + 2);
  let lo = Infinity, hi = -Infinity;
  if (i1 - i0 <= 0.6 * W) {                       // sparse: a real polyline is cheap and exact
    for (let i = i0; i < i1; i++) { const v = arr[i]; if (v === v) { const y = tf ? tf(v) : v; if (y < lo) lo = y; if (y > hi) hi = y; } }
    return {mode: 0, i0, i1, lo, hi};
  }
  const mn = new Float32Array(W).fill(Infinity), mx = new Float32Array(W).fill(-Infinity), ls = new Float32Array(W), k = W / span;
  for (let i = i0; i < i1; i++) {
    const v = arr[i]; if (v !== v) continue;
    const y = tf ? tf(v) : v;
    let c = Math.floor((i * res + res / 2 - t0) * k); if (c < 0 || c >= W) continue;
    if (y < mn[c]) mn[c] = y; if (y > mx[c]) mx[c] = y; ls[c] = y;
    if (y < lo) lo = y; if (y > hi) hi = y;
  }
  return {mode: 1, mn, mx, ls, lo, hi, W};
}
// draw a decimated series into rect r; fy maps (transformed) value -> pixel y; off adds a value offset; step for categorical
function strokeSeries(c, dd, arr, res, r, t0, t1, fy, tf, color, lw, step, off, sc) {
  const span = t1 - t0, k = r.w / span;
  c.beginPath(); c.strokeStyle = color; c.lineWidth = lw;
  const o = off || 0, m = sc || 1;
  if (dd.mode === 0) {
    let started = false, py = 0;
    for (let i = dd.i0; i < dd.i1; i++) {
      let v = arr[i]; if (v !== v) { started = false; continue; }
      const x = r.x + (i * res + (step ? 0 : res / 2) - t0) * k, y = fy((tf ? tf(v) : v) * m + o);
      if (!started) { c.moveTo(x, y); started = true; } else { if (step) c.lineTo(x, py); c.lineTo(x, y); }
      py = y;
    }
    if (started && step) c.lineTo(r.x + r.w, py);
  } else {
    // dense: one pixel-aligned rect per column spanning [min,max]. No anti-aliasing / joins, ~10x cheaper than a zigzag stroke.

}

// ------------------------------------------------------------------ benchmark (?test&bench): timings are POSTed to the server log
async function bench() {
  const out = [], cfgs = [['72 h', 0, 259200], ['24 h', 86400, 172800], ['6 h', 100000, 121600], ['1 h', 100000, 103600], ['10 min', 100000, 100600]];
  for (const [name, a, b] of cfgs) {
    setTarget(a, b, true); cssv = getComputedStyle(document.documentElement);
    drawBase(); drawStrip(); drawMap();                                   // warm up
    const N = 40, t = performance.now();
    for (let i = 0; i < N; i++) { const sh = (b - a) * 0.01 * i; view.t0 = a + sh; view.t1 = b + sh; drawBase(); drawStrip(); drawMap(); }
    const full = (performance.now() - t) / N;
    const t2 = performance.now(); S.hoverX = 600; S.hoverY = 200; for (let i = 0; i < N; i++) drawTop(); const hov = (performance.now() - t2) / N;
    const tm = f => { const t = performance.now(); for (let i = 0; i < 20; i++) f(); return ((performance.now() - t) / 20).toFixed(1); };
    view.t0 = a; view.t1 = b;
    out.push(`   parts: base ${tm(drawBase)} ms, strip ${tm(drawStrip)} ms, map ${tm(drawMap)} ms`);
    out.push(`${name.padEnd(7)} res=${curRes}s  full redraw ${full.toFixed(1)} ms  (${(1000 / full).toFixed(0)} fps)   hover layer ${hov.toFixed(2)} ms`);
    setTarget(a, b, true);
  }
  await fetch('/perf', {method: 'POST', body: out.join('\n')});
}
init().catch(err => { $('status').textContent = 'error: ' + err; console.error(err); });
